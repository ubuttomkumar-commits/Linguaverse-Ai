<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#05091F" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>LINGUAVERSE AI — Admin Control Center</title>
    <meta
      name="description"
      content="Separate RBAC-protected LINGUAVERSE AI Administration & Operations Portal."
    />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      @keyframes lv-admin-spin{to{transform:rotate(360deg)}}
      #lv-admin-splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#05091F;color:#E2E8F0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px;text-align:center}
      #lv-admin-ring{width:36px;height:36px;border-radius:9999px;border:3px solid rgba(99,102,241,0.24);border-top-color:#00D9FF;animation:lv-admin-spin 0.8s linear infinite}
    </style>
  </head>
  <body class="bg-[#05091F] text-slate-100 antialiased selection:bg-[#087BFF]/35 selection:text-white">
    <div id="admin-root">
      <div id="lv-admin-splash" role="status" aria-live="polite">
        <div id="lv-admin-ring" aria-hidden="true"></div>
        <div id="lv-admin-title" style="font-size:14px;font-weight:700;letter-spacing:0.06em;color:#FFFFFF">LINGUAVERSE AI · ADMIN</div>
        <div id="lv-admin-msg" style="font-size:12.5px;color:#94A3B8;max-width:340px;line-height:1.5">Loading administrator console...</div>
      </div>
    </div>
    <script>
      (function () {
        var GUARD = 'lv_boot_reload_once_v1';
        var recovered = false;
        function showAdminFallback() {
          if (window.__LV_APP_MOUNTED__ || recovered) return;
          recovered = true;
          try {
            var prev = Number(window.sessionStorage.getItem(GUARD) || '0');
            if (!prev || Date.now() - prev > 30000) {
              window.sessionStorage.setItem(GUARD, String(Date.now()));
              window.location.reload();
              return;
            }
          } catch (_) {}
          var splash = document.getElementById('lv-admin-splash');
          if (!splash) return;
          var ring = document.getElementById('lv-admin-ring');
          if (ring) ring.style.display = 'none';
          var title = document.getElementById('lv-admin-title');
          if (title) title.textContent = 'Admin Portal Failed to Load';
          var msg = document.getElementById('lv-admin-msg');
          if (msg) msg.textContent = 'A network interruption or new deployment prevented startup. Reload to fetch the latest Admin bundle.';
          if (!document.getElementById('lv-admin-retry-btn')) {
            var btn = document.createElement('button');
            btn.id = 'lv-admin-retry-btn';
            btn.type = 'button';
            btn.textContent = 'Reload Admin Portal';
            btn.style.cssText = 'margin-top:8px;padding:10px 20px;border-radius:12px;border:none;background:#3B82F6;color:#FFFFFF;font-weight:700;font-size:13.5px;cursor:pointer';
            btn.onclick = function () {
              try { window.sessionStorage.removeItem(GUARD); } catch (_) {}
              window.location.reload();
            };
            splash.appendChild(btn);
          }
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t.tagName === 'SCRIPT' && !window.__LV_APP_MOUNTED__) {
            showAdminFallback();
          }
        }, true);
        window.setTimeout(showAdminFallback, 12000);
      })();
    </script>
    <script type="module" src="/src/admin-main.tsx"></script>
  </body>
</html>
