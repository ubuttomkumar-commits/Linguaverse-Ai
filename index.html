    <style>
      @keyframes lv-boot-spin{to{transform:rotate(360deg)}}
      #lv-boot-splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#05091F;color:#E2E8F0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px;text-align:center}
      #lv-boot-ring{width:38px;height:38px;border-radius:9999px;border:3px solid rgba(59,130,246,0.22);border-top-color:#00D9FF;animation:lv-boot-spin 0.8s linear infinite}
    </style>
  </head>
  <body class="bg-[#05091F] text-slate-100 antialiased selection:bg-[#087BFF]/35 selection:text-white">
    <div id="root">
      <div id="lv-boot-splash" role="status" aria-live="polite">
        <div id="lv-boot-ring" aria-hidden="true"></div>
        <div id="lv-boot-title" style="font-size:15px;font-weight:700;letter-spacing:0.06em;color:#FFFFFF">LINGUAVERSE AI</div>
        <div id="lv-boot-msg" style="font-size:12.5px;color:#94A3B8;max-width:340px;line-height:1.5">Preparing your speaking workspace...</div>
      </div>
    </div>
    <script>
      (function () {
        var GUARD = 'lv_boot_reload_once_v1';
        var recovered = false;
        function purgeAndReload() {
          var finish = function () { window.location.reload(); };
          try {
            if ('caches' in window) {
              window.caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return window.caches.delete(k); }));
              }).then(finish, finish);
              return;
            }
          } catch (_) {}
          finish();
        }
        function showBootFallback() {
          if (window.__LV_APP_MOUNTED__ || recovered) return;
          recovered = true;
          try {
            var prev = Number(window.sessionStorage.getItem(GUARD) || '0');
            if (!prev || Date.now() - prev > 30000) {
              window.sessionStorage.setItem(GUARD, String(Date.now()));
              purgeAndReload();
              return;
            }
          } catch (_) {}
          var splash = document.getElementById('lv-boot-splash');
          if (!splash) return;
          var ring = document.getElementById('lv-boot-ring');
          if (ring) ring.style.display = 'none';
          var title = document.getElementById('lv-boot-title');
          if (title) title.textContent = 'Unable to Finish Loading';
          var msg = document.getElementById('lv-boot-msg');
          if (msg) msg.textContent = 'A network interruption or new app update prevented startup. Tap below to reload the latest version cleanly.';
          if (!document.getElementById('lv-boot-retry-btn')) {
            var btn = document.createElement('button');
            btn.id = 'lv-boot-retry-btn';
            btn.type = 'button';
            btn.textContent = 'Reload Fresh App';
            btn.style.cssText = 'margin-top:8px;padding:10px 20px;border-radius:12px;border:none;background:#3B82F6;color:#FFFFFF;font-weight:700;font-size:13.5px;cursor:pointer';
            btn.onclick = function () {
              try { window.sessionStorage.removeItem(GUARD); } catch (_) {}
              purgeAndReload();
            };
            splash.appendChild(btn);
          }
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t.tagName === 'SCRIPT' && !window.__LV_APP_MOUNTED__) {
            showBootFallback();
          }
        }, true);
        window.setTimeout(showBootFallback, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
