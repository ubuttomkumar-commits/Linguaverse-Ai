# LINGUAVERSE AI — Cloudflare Workers + D1 + KV + Cron Configuration (PRD v6.1)
# Provisioned on Cloudflare Account: fa6ffb91f755b6a7066cd0cf4ce70556 (APAC D1)
#
# NOTE:
# - Learner PWA (`dist/`) and Separate Admin App (`dist-admin/`) deploy to separate
#   Cloudflare Pages projects (see docs/CLOUDFLARE_DEPLOYMENT.md).
# - Cloudflare R2 is NOT yet activated on this account (API code 10042: "Please enable R2
#   through the Cloudflare Dashboard"). Worker audio/media R2 routes degrade cleanly with
#   HTTP 503 until the owner activates R2 and uncomments the [[env.*.r2_buckets]] blocks below.

name = "linguaverse-ai-api"
main = "worker/index.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# ============================================================================
# Top-Level (Local Development via `npx wrangler dev` — points to staging D1/KV)
# ============================================================================
[vars]
APP_ENV = "development"
DEFAULT_UI_LANGUAGE = "en"
GEMINI_PRIMARY_MODEL = "gemini-4-hydrogen"
GEMINI_FALLBACK_MODEL = "gemini-3.1-flash-lite"
GEMINI_TRANSCRIBE_MODEL = "gemini-3.5-transcribe"
GEMINI_TTS_MODEL = "gemini-3.8-flash-lite-tts"
SPEAKING_PROMPT_VERSION = "speaking-eval-v5.0"
TRANSFER_PROMPT_VERSION = "transfer-rubric-v5.1"
AUDIO_RETENTION_DAYS = "30"
RATE_LIMIT_REQUESTS_PER_MINUTE = "30"
EMAIL_FROM = "LINGUAVERSE AI <noreply@linguaverse.ai>"

[[d1_databases]]
binding = "DB"
database_name = "linguaverse-db-staging"
database_id = "19181902-a6d5-4d95-9d5f-a7e71016ecc9"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "LINGUAVERSE_KV"
id = "2b6558da20cc45cdb0b6a5b3f5500dc2"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "7838b1514ab84ec7a0e8627c6046b8d2"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "afe07d0d0a1c421c9d54aa196edba2a1"

# ============================================================================
# Staging / Preview Environment (`--env staging`)
# Worker URL: https://linguaverse-ai-api-staging.uttombarmon45.workers.dev
# ============================================================================
[env.staging]
name = "linguaverse-ai-api-staging"

[env.staging.placement]
mode = "smart"

[env.staging.vars]
APP_ENV = "staging"
DEFAULT_UI_LANGUAGE = "en"
GEMINI_PRIMARY_MODEL = "gemini-4-hydrogen"
GEMINI_FALLBACK_MODEL = "gemini-3.1-flash-lite"
GEMINI_TRANSCRIBE_MODEL = "gemini-3.5-transcribe"
GEMINI_TTS_MODEL = "gemini-3.8-flash-lite-tts"
SPEAKING_PROMPT_VERSION = "speaking-eval-v5.0"
TRANSFER_PROMPT_VERSION = "transfer-rubric-v5.1"
AUDIO_RETENTION_DAYS = "14"
RATE_LIMIT_REQUESTS_PER_MINUTE = "30"
EMAIL_FROM = "LINGUAVERSE AI Staging <noreply@linguaverse.ai>"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "linguaverse-db-staging"
database_id = "19181902-a6d5-4d95-9d5f-a7e71016ecc9"
migrations_dir = "migrations"

[[env.staging.kv_namespaces]]
binding = "LINGUAVERSE_KV"
id = "2b6558da20cc45cdb0b6a5b3f5500dc2"

[[env.staging.kv_namespaces]]
binding = "SESSION_KV"
id = "7838b1514ab84ec7a0e8627c6046b8d2"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "afe07d0d0a1c421c9d54aa196edba2a1"

# Uncomment after enabling R2 in Cloudflare Dashboard (code 10042) & creating staging buckets:
# [[env.staging.r2_buckets]]
# binding = "AUDIO_BUCKET"
# bucket_name = "linguaverse-audio-staging"
# [[env.staging.r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "linguaverse-media-staging"

[env.staging.triggers]
crons = ["0 */6 * * *"]

# ============================================================================
# Production Environment (`--env production`)
# Worker URL: https://linguaverse-ai-api-prod.uttombarmon45.workers.dev
# ============================================================================
[env.production]
name = "linguaverse-ai-api-prod"
# Uncomment and set your custom domain/zone after DNS onboarding:
# routes = [
#   { pattern = "api.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]

[env.production.placement]
mode = "smart"

[env.production.vars]
APP_ENV = "production"
DEFAULT_UI_LANGUAGE = "en"
GEMINI_PRIMARY_MODEL = "gemini-4-hydrogen"
GEMINI_FALLBACK_MODEL = "gemini-3.1-flash-lite"
GEMINI_TRANSCRIBE_MODEL = "gemini-3.5-transcribe"
GEMINI_TTS_MODEL = "gemini-3.8-flash-lite-tts"
SPEAKING_PROMPT_VERSION = "speaking-eval-v5.0"
TRANSFER_PROMPT_VERSION = "transfer-rubric-v5.1"
AUDIO_RETENTION_DAYS = "30"
RATE_LIMIT_REQUESTS_PER_MINUTE = "25"
EMAIL_FROM = "LINGUAVERSE AI <noreply@linguaverse.ai>"

[[env.production.d1_databases]]
binding = "DB"
database_name = "linguaverse-db"
database_id = "820f66eb-f97d-4b9a-a516-467d01578c4c"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "LINGUAVERSE_KV"
id = "31fd9f32dac341d8ac5adedbdea3e1cb"

[[env.production.kv_namespaces]]
binding = "SESSION_KV"
id = "472e8e9880474f1aafca7279a1faa427"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "7ee0c176d0a548589f0372b19ea90407"

# Uncomment after enabling R2 in Cloudflare Dashboard (code 10042) & creating production buckets:
# [[env.production.r2_buckets]]
# binding = "AUDIO_BUCKET"
# bucket_name = "linguaverse-audio"
# [[env.production.r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "linguaverse-media"

[env.production.triggers]
crons = ["0 3 * * *", "0 */6 * * *"]
