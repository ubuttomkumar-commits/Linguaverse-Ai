name: LINGUAVERSE AI — CI/CD (Typecheck, Tests, Build & Cloudflare Deploy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_cloudflare:
        description: 'Run Cloudflare D1 migrations + Worker + Pages deploy'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Unit & Worker Parity Tests, Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: TypeScript typecheck
        run: npm run lint

      - name: Verify D1 SQLite migrations (0001 -> 0004), foreign keys, seed idempotency & rollbacks
        run: npm run verify:db

      - name: Run domain, storage, and Cloudflare Worker parity tests
        run: npm test

      - name: Build User Application and Separate Admin Application production bundles
        run: npm run build:all

      - name: Scan frontend bundles (dist/ and dist-admin/) for accidental secret leakage
        run: |
          if grep -rnE "AIza[0-9A-Za-z_-]{20,}|re_[0-9A-Za-z]{20,}|sk_live_[0-9A-Za-z]{16,}|whsec_[0-9A-Za-z]{12,}|JWT_SIGNING_SECRET|GEMINI_API_KEY=" dist/ dist-admin/; then
            echo "ERROR: Potential secret detected in dist/ or dist-admin/ output!"
            exit 1
          fi
          echo "Bundle secret scan passed for both User App and Separate Admin App."

  deploy-cloudflare:
    name: Deploy D1 Migrations, Worker API & Pages
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_cloudflare == 'true'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify required Cloudflare deployment secrets exist
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "Skipping deploy: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret is not configured."
            exit 1
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Apply additive D1 migrations sequentially (0001 -> 0004) & idempotent reference seed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply linguaverse-db --remote --env production
          npx wrangler d1 execute linguaverse-db --remote --env production --file=./db/seeds/seed_reference_data.sql

      - name: Deploy Cloudflare Worker API (production environment)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

      - name: Build & deploy User Application to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          npm run build
          npx wrangler pages deploy dist --project-name=linguaverse-ai

      - name: Build & deploy Separate Admin Application to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          npm run build:admin
          npx wrangler pages deploy dist-admin --project-name=linguaverse-admin
