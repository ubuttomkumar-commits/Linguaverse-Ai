name: LINGUAVERSE AI — CI/CD (Typecheck, Tests, Build & Cloudflare Deploy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_cloudflare:
        description: 'Run Cloudflare D1 migrations + Worker + Pages deploy'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Unit & Worker Parity Tests, Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run domain, storage, and Cloudflare Worker parity tests
        run: npx --yes tsx --test src/domain/*.test.ts src/services/storage/*.test.ts worker/*.test.ts

      - name: Build frontend production bundle
        run: npm run build

      - name: Scan frontend bundle for accidental secret leakage
        run: |
          if grep -rnE "AIza[0-9A-Za-z_-]{20,}|re_[0-9A-Za-z]{20,}|sk_live_[0-9A-Za-z]{16,}|whsec_[0-9A-Za-z]{12,}|JWT_SIGNING_SECRET|GEMINI_API_KEY=" dist/; then
            echo "ERROR: Potential secret detected in dist/ output!"
            exit 1
          fi
          echo "Bundle secret scan passed."

  deploy-cloudflare:
    name: Deploy D1 Migrations, Worker API & Pages
    needs: verify
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_cloudflare == 'true')
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify required Cloudflare deployment secrets exist
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "Skipping deploy: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret is not configured."
            exit 1
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Apply additive D1 migrations sequentially (0001 -> 0002 -> 0003 -> 0004)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute linguaverse-db --remote --file=./migrations/0001_initial_schema.sql
          npx wrangler d1 execute linguaverse-db --remote --file=./migrations/0002_parts06_12_parity.sql
          npx wrangler d1 execute linguaverse-db --remote --file=./migrations/0003_p3_community_vocab_billing.sql
          npx wrangler d1 execute linguaverse-db --remote --file=./migrations/0004_prd61_examinations_labs_providers.sql

      - name: Deploy Cloudflare Worker API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Build & deploy frontend to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          npm run build
          npx wrangler pages deploy dist --project-name=linguaverse-ai
